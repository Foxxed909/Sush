name: Package Sush Nightly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:nightly
      - uses: actions/upload-artifact@v4
        with:
          name: sush-nightly-${{ matrix.os }}
          path: |
            dist-nightly/*.exe
            dist-nightly/*.dmg
            dist-nightly/*.AppImage
          if-no-files-found: error
