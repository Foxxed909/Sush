name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sush:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (errors fail, warnings report)
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Nightly visual smoke
        if: matrix.os == 'ubuntu-latest'
        run: node tools/shot.mjs shots-ci
      - name: Upload Nightly screenshots
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sush-nightly-screenshots
          path: shots-ci/
          if-no-files-found: error
